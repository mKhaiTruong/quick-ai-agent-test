[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-ai-chatbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Core LLM + LangChain ecosystem
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-anthropic",
    "langchain-huggingface",
    "langchain-pinecone",
    "langchain-text-splitters",
    "sentence-transformers",
    "langgraph==1.2.0",

    # Vector DB
    "pinecone[asyncio]>=6.0.0,<8.0.0",

    # UI
    "streamlit>=1.0.0",

    # PDF
    "pypdf",

    # Search
    "tavily-python",

    # Web scraping
    "flask",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "lxml>=5.0.0",
    "trafilatura",
    "readability-lxml",

    # Env + utils
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]